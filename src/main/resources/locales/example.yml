# ---------------------------------------------------------------------------
# example.yml — default Synergy translations
#
# Structure:
#   translation-key:
#     en: "English text"
#     uk: "Текст українською"
#
# Use %nl% for an explicit newline inside a single string.
# Multi-line values can also be written as a YAML list (see multiline example).
# ---------------------------------------------------------------------------

hello-world:
  en: "Hello, World!"
  uk: "Привіт, Світе!"

no-permission:
  en: "<red>You don't have permission to do that."
  uk: "<red>У вас немає дозволу на це."

player-only:
  en: "This command can only be used by players."
  uk: "Цю команду можуть використовувати лише гравці."

multiline-example:
  en:
    - "Line one"
    - "Line two"
    - "Line three"
  uk:
    - "Перший рядок"
    - "Другий рядок"
    - "Третій рядок"